    .tool-card p { margin:9px 0 24px; color:var(--muted); font-size:.92rem; }
    .tool-link { display:inline-flex; align-items:center; justify-content:space-between; gap:12px; width:100%; margin-top:auto; padding:11px 14px; border-radius:10px; background:var(--accent); color:#fff; font-size:.92rem; font-weight:700; text-decoration:none; transition:background .18s ease; }
    .tool-link:hover { background:var(--accent-hover); }
    .tool-link:focus-visible, .brand:focus-visible { outline:3px solid #9da8ff; outline-offset:3px; }
    .site-footer { border-top:1px solid var(--line); background:#fff; }
    .footer-inner { display:flex; justify-content:space-between; gap:18px; padding-block:24px; color:var(--muted); font-size:.85rem; }

    @media (max-width:800px) { .tool-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .hero { padding-top:58px; } }
    @media (max-width:560px) { .header-inner,main,.footer-inner { width:min(100% - 32px,1080px); } .header-inner { min-height:66px; } .header-note { display:none; } .hero { padding:48px 0 36px; } .hero-description { font-size:.98rem; } .tool-grid { grid-template-columns:1fr; gap:14px; padding-bottom:52px; } .tool-card { min-height:0; padding:21px; } .section-heading { align-items:start; } .footer-inner { flex-direction:column; gap:5px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
